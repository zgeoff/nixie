# Secret-scanning config for gitleaks (PR job + pre-commit hook). Extends the
# default ruleset.

[extend]
useDefault = true

# a Google OAuth client secret on its own line, which the default rules catch
# only beside a key name such as client_secret
[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[A-Za-z0-9_-]{28}'''
keywords = ["gocspx-"]

# a Tailscale MagicDNS name, which gives away a private tailnet
[[rules]]
id = "tailnet-host"
description = "Tailscale MagicDNS host name"
regex = '''\b[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.ts\.net\b'''
keywords = [".ts.net"]

# the generated rule file of the secret scan lib holds the patterns of public secret rules, one of
# which matches a pattern's own text, and its header holds the pinned commit hash; it holds no secret
[[allowlists]]
description = "the generated public rule patterns of the secret scan lib"
targetRules = ["aws-amazon-bedrock-api-key-short-lived", "sourcegraph-access-token"]
paths = ['''libs/secret-scan/src/generated/public-rules\.generated\.ts''']
