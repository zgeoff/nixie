# A throwaway nixie for one pull request: a test build on the test sandbox, the web client, and one
# origin in front of both. Every start of a new project makes a fresh database and a fresh
# deployment key. Run it from this folder:
#   docker compose up --build --wait
name: nixie-preview

services:
  nixie:
    build:
      context: ..
      dockerfile: preview/Dockerfile
    image: nixie-preview:local
    # On a host with a credential broker, such as an imp, the model calls go through the broker's
    # proxy, which adds the credential on the way out. The proxy and its CA bundle come from the
    # host's environment, so every compose command here builds the same container. A host without
    # them leaves each variable empty: Bun ignores an empty one, and nixie passes none to a guest.
    environment:
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1
      NODE_USE_ENV_PROXY: '1'
      SSL_CERT_FILE: ${SSL_CERT_FILE:+/etc/nixie-preview/broker-ca.pem}
      NODE_EXTRA_CA_CERTS: ${SSL_CERT_FILE:+/etc/nixie-preview/broker-ca.pem}
      # a host that counts each preview's model spend names the route its counting proxy holds for
      # this preview, which goes in front of every model API path; empty, the calls take none
      NIXIE_PREVIEW_MODEL_ROUTE: ${PREVIEW_MODEL_ROUTE:-}
    volumes:
      - data:/data
      - secrets:/var/lib/nixie-preview
      - ${SSL_CERT_FILE:-/dev/null}:/etc/nixie-preview/broker-ca.pem:ro
    healthcheck:
      test: ['CMD', '/app/preview/run-preview.sh', 'health']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24
    # a reset exits the server 0 and leaves its next start to the container runtime, as Kubernetes
    # does in production; a docker compose stop still keeps it down
    restart: unless-stopped
    # longer than the runner pools' grace, so a stop lets the steps in flight commit
    stop_grace_period: 45s

  # prints a code that signs one device in, once nixie is ready; run it again for another code
  enrol:
    image: nixie-preview:local
    command: ['enrol-code']
    volumes:
      - data:/data
      - secrets:/var/lib/nixie-preview
    depends_on:
      nixie:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: nixie-web-preview:local
    environment:
      NIXIE_API_URL: http://nixie:8080
    depends_on:
      nixie:
        condition: service_healthy

  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # every interface by default, so the preview host's proxy reaches it; a PC run sets 127.0.0.1
    ports:
      - ${NIXIE_PREVIEW_BIND:-0.0.0.0}:${NIXIE_PREVIEW_PORT:-8080}:8080
    # the origin opens once a sign-in code is printed, and up --wait waits for enrol to finish
    depends_on:
      enrol:
        condition: service_completed_successfully
      web:
        condition: service_healthy

volumes:
  data:
  secrets:
