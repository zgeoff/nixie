# The preview's deployment configuration: a test build on the test sandbox, which runs every guest
# as a local process with no isolation, so the preview needs no impd. It holds invented data only.
server:
  data_dir: /data
  port: 8080
  secrets_file: /var/lib/nixie-preview/secrets.yaml
owner:
  # an invented name, so the preview shows how nixie addresses the person it works for
  name: Juniper Vale
models:
  profiles:
    preview:
      harness: agent-sdk
      base_url: https://api.anthropic.com
      # a placeholder that the host's credential broker replaces in the authorization header on the
      # way out
      credential: deployment:broker
      auth_header: bearer
      model: claude-haiku-5-5
      effort: low
      # Anthropic's list prices for Claude Haiku 5.5, in US dollars per million tokens, from
      # https://platform.claude.com/docs/en/about-claude/pricing: the base set for a prompt up to
      # 100,000 tokens and the long-prompt set for a longer one
      prices:
        input: 0.1
        cache_write: 0.125
        cache_write_1h: 0.2
        cached_input: 0.01
        output: 0.5
        long_prompt:
          over_tokens: 100000
          input: 0.5
          cache_write: 0.625
          cache_write_1h: 1
          cached_input: 0.05
          output: 2.5
  roles:
    conversation: preview
    # the preview's worker runs on the same profile, so a started task can hand a question to a worker
    worker: preview
  limits:
    workerRun:
      # one worker run stops at the first of these; the minutes must sit under the tool call wait
      # of the conversation's harness, which the config schema checks
      minutes: 5
      turns: 10
      tokens: 500000
      dollars: 0.5
sandbox:
  adapter: test
# the preview runs no backup job, so nixie stages no backup set
backup:
  enabled: false
# the assistant's computer and its code tool, which each need their sandbox image
computer: {}
code: {}
# Google's Gmail, Calendar and Drive tools, which need a Google account
google: {}
definitions:
  source:
    kind: path
    path: /app/preview/definitions
images:
  # a draw with no profile uses the one that default names; the prices are micros of a US dollar per
  # image, from https://platform.openai.com/docs/pricing and
  # https://ai.google.dev/gemini-api/docs/pricing
  default: openai
  profiles:
    openai:
      provider: openai
      model: gpt-image-1
      credential: deployment:openai-images
      prices: { 1024x1024: 42000, 1536x1024: 63000, 1024x1536: 63000 }
    google:
      provider: gemini
      model: gemini-2.5-flash-image
      credential: deployment:gemini-images
      prices: { 1024x1024: 39000, 1536x1024: 39000, 1024x1536: 39000 }
