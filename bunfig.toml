# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their own dependencies stay behind it.
# Renovate bumps @zgeoff and @impz packages as soon as they publish, so each
# one nixie uses needs an entry here, or bun install refuses the bump.
minimumReleaseAgeExcludes = [
  "@impz/client",
  "@impz/testing",
  "@zgeoff/bun-test-extended",
  "@zgeoff/bun-test-react",
  "@zgeoff/format-codemod",
  "@zgeoff/kysely-bun-sqlite",
  "@zgeoff/oxlint-config",
  "@zgeoff/skill-gate",
  "@zgeoff/std",
  # tsrs 0.18.0 and its native packages skip the gate so typecheck can move to
  # it now; these entries come out on 2026-10-26, once tsrs 0.18.0 is 7 days old
  "tsrs",
  "@tsrs/darwin-arm64",
  "@tsrs/linux-arm64-gnu",
  "@tsrs/linux-arm64-musl",
  "@tsrs/linux-x64-gnu",
  "@tsrs/linux-x64-musl",
  # body-parser 2.4.0 fixes GHSA-27r3-jxmh-p828 and skips the gate so the audit
  # passes now; this entry comes out on 2026-10-29, once 2.4.0 is 7 days old
  "body-parser",
  # fast-uri 3.1.9 fixes GHSA-w74x-v6f9-j3xg and skips the gate so the audit
  # passes now; this entry comes out on 2026-10-27, once 3.1.9 is 7 days old
  "fast-uri",
  # happy-dom 21.0.4 fixes GHSA-834v-8h66-3h79, and the root overrides force it
  # under @zgeoff/bun-test-react; these entries come out on 2026-10-28, once
  # 21.0.4 is 7 days old
  "happy-dom",
  "@happy-dom/global-registrator",
]

[test]
# spikes run by hand, and CI only typechecks them
pathIgnorePatterns = ["docs/design/**", "research/**"]

# registers the jest-extended matchers for `bun test`
preload = [
  "./libs/testing/src/define-test-build.ts",
  "./libs/testing/src/set-test-tmpdir.ts",
  "@zgeoff/bun-test-extended",
  "@zgeoff/bun-test-react",
  "./libs/testing/src/restore-native-form-data.ts",
  "./libs/testing/src/restore-native-base64.ts",
  "./libs/mock-server/src/start-mock-server.ts",
  "./apps/web/src/mocks/test-preload.ts",
  "./adapters/definitions-github/src/mocks/test-preload.ts",
]
