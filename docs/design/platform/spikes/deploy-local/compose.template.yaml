# The deployment repo's Compose file. run.sh writes the image digest in place of NIXIE_IMAGE, as a
# dependency bot would, and each upgrade or rollback is a commit that changes only that line.
name: nixie-spike-deploy
services:
  nixie:
    image: NIXIE_IMAGE
    user: ${NIXIE_UID}:${NIXIE_GID}
    environment:
      NIXIE_DATA_DIR: /data
      NIXIE_OFFSITE_DIR: /offsite
      NIXIE_SECRETS_SOPS: /deploy/secrets.yaml
      SOPS_AGE_KEY_FILE: /run/age/host.key
    volumes:
      - ./secrets.yaml:/deploy/secrets.yaml:ro
      - ${NIXIE_AGE_KEY_FILE}:/run/age/host.key:ro
      - ${NIXIE_DATA_DIR}:/data
      - ${NIXIE_OFFSITE_DIR}:/offsite
    ports:
      - 127.0.0.1:${NIXIE_PORT}:8080
    healthcheck:
      test: [CMD, bun, app.ts, healthcheck]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 5s
    restart: on-failure:2
