# Runs the computer guest's command tests, which start each command in new user, network and process
# namespaces. GitHub's Ubuntu runners refuse unprivileged user namespaces, so the job allows them
# first; the runner is thrown away after the job. The shared unit lane leaves these tests out,
# because its runner keeps the restriction. shell-namespaces-main.yml runs the same job on each push
# to main.
name: Shell namespaces

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  userns:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        run: bun run test:userns
