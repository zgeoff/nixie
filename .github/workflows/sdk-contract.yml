# Runs the Agent SDK contract suite in evals/sdk-contract on a pull request that changes the SDK
# version that bun.lock resolves, or that changes the suite itself, so a bump fails until every
# probe passes on the new version. Every other pull request passes the job without a model call.
# The probes call the model on the subscription with the CLAUDE_CODE_OAUTH_TOKEN secret, and a run
# without it fails.
name: SDK contract

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sdk-contract-${{ github.ref }}
  cancel-in-progress: true

# an explicit bash runs each step with pipefail, so a failure inside a pipeline fails the step
defaults:
  run:
    shell: bash

jobs:
  sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # the SDK and its native packages, each as name@version, from a lockfile on stdin
      - name: Find whether the SDK version or the suite changed
        id: changes
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          list_sdk() { grep -o '"@anthropic-ai/claude-agent-sdk[a-z0-9-]*@[^"]*"' | sort -u || true; }
          base_sdk=$(git show "$BASE:bun.lock" | list_sdk)
          head_sdk=$(list_sdk < bun.lock)
          suite=$(git diff --name-only "$BASE...HEAD" -- evals/sdk-contract evals/test-utils \
            .github/workflows/sdk-contract.yml)
          if [[ $base_sdk != "$head_sdk" ]]; then
            reason="the SDK version changed"
          elif [[ -n $suite ]]; then
            reason="the suite changed"
          else
            reason=""
          fi
          echo "run=$([[ -n $reason ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "SDK on the base: $(grep -m 1 'claude-agent-sdk@' <<< "$base_sdk" || true)"
            echo "SDK on the head: $(grep -m 1 'claude-agent-sdk@' <<< "$head_sdk" || true)"
            echo "Contract run: ${reason:-not needed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Bun
        if: steps.changes.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        if: steps.changes.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Run the contract suite
        if: steps.changes.outputs.run == 'true'
        env:
          NIXIE_SDK_CONTRACT: '1'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bun test evals/sdk-contract
