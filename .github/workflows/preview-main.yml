# Starts the preview recipe on each push to main, as preview.yml starts it on a pull request, in
# full. A push to main keeps each run, so every merged commit starts the preview.
name: Preview main

on:
  push:
    branches: [main]

permissions:
  contents: read

# keyed by commit and never cancelled, so every push to main runs in full; two runs of one
# commit, such as a rerun, wait for each other
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

# an explicit bash runs each step with pipefail, so a failure inside a pipeline fails the step
defaults:
  run:
    shell: bash
    working-directory: preview

jobs:
  changes:
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@63f150fe10398a189436f95e12af7993bbb5431a # main
    with:
      paths: |
        .github/workflows/preview-main.yml
        .bun-version
        .dockerignore
        bun.lock
        bunfig.toml
        package.json
        tsconfig*.json
        adapters/**
        apps/**
        guests/**
        libs/**
        modules/**
        preview/**
        scripts/compose/**
        scripts/lib/**

  compose:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # the web image shares its layers with the Images workflow's web build through the web scope,
      # and the test build with the Compose workflow's through the preview scope
      - name: Build the images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: ./preview
          files: compose.yaml
          load: true
          set: |
            nixie.cache-from=type=gha,scope=preview
            nixie.cache-to=type=gha,mode=max,scope=preview
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,mode=max,scope=web

      # the builder keeps a second copy of each layer it loaded into Docker, on the disk that holds
      # the data volume, and nixie reports unready once that disk is 90% full
      - name: Free the builder's cache
        run: docker buildx prune --all --force

      - name: Start the preview
        run: docker compose up --wait --wait-timeout 300

      - name: Check the health URL
        env:
          ORIGIN: http://127.0.0.1:8080
        run: bun run --silent ci:compose:check-health-url

      - name: Check the sign-in code
        run: bun run --silent ci:compose:check-sign-in-code preview

      - name: Show the logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the preview
        if: always()
        run: docker compose down --volumes
