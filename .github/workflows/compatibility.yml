# Checks a pull request against the last release, the newest v* tag reachable from its base, so the
# release after it can roll back by one release: the oRPC contract only grows, and each migration
# since that release keeps the schema readable by it unless nixie-schema.ts declares the break.
# Before the first release, both checks pass with nothing to compare.
name: Compatibility

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Find the last release
        id: last
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' "$BASE" 2> /dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Last release: ${tag:-none yet}" >> "$GITHUB_STEP_SUMMARY"

      # oasdiff fails on a removed procedure, a removed or retyped output field, a new required input
      # field or a narrowed input type, and allows the removal of a procedure that the last release
      # marks deprecated
      - name: Check that the contract only grows
        if: steps.last.outputs.tag != ''
        env:
          TAG: ${{ steps.last.outputs.tag }}
        run: |
          bun run --cwd libs/contract openapi
          git show "$TAG:libs/contract/openapi.json" > "$RUNNER_TEMP/last-openapi.json"
          cp libs/contract/openapi.json "$RUNNER_TEMP/openapi.json"
          docker run --rm -v "$RUNNER_TEMP:/specs:ro" \
            tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c \
            breaking /specs/last-openapi.json /specs/openapi.json --fail-on ERR

      - name: Check the migrations since the last release
        env:
          TAG: ${{ steps.last.outputs.tag }}
        run: |
          if [[ -n $TAG ]]; then
            .github/scripts/read-released-schema.sh "$TAG" "$RUNNER_TEMP/released.json"
            bun libs/db/src/run-migration-check.ts --released "$RUNNER_TEMP/released.json" \
              --last-tag "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            bun libs/db/src/run-migration-check.ts | tee -a "$GITHUB_STEP_SUMMARY"
          fi
