# Checks a pull request against the last release, the newest v* tag reachable from its base, so the
# release after it can roll back by one release: the oRPC contract only grows, and each migration
# since that release keeps the schema readable by it unless nixie-schema.ts declares the break.
# Before the first release, both checks pass with nothing to compare. A pull request runs it only
# when it changes a file the checks read; every push to main runs it in full, against the newest v*
# tag reachable from the pushed commit.
name: Compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

# an explicit bash runs each step with pipefail, so a failure inside a pipeline fails the step
defaults:
  run:
    shell: bash

jobs:
  changes:
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@sync-v32
    with:
      paths: |
        .github/workflows/compatibility.yml
        .github/scripts/check-accepted-breaks.sh
        .github/scripts/check-contract-growth.sh
        .github/scripts/read-released-schema.sh
        .bun-version
        bun.lock
        bunfig.toml
        package.json
        tsconfig*.json
        libs/contract/**
        libs/db/**

  compatibility:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Find the last release
        id: last
        env:
          BASE:
            ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) ||
            github.sha }}
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' "$BASE" 2> /dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Last release: ${tag:-none yet}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the contract check accepts only the breaks it lists
        run: .github/scripts/check-accepted-breaks.sh

      # oasdiff fails on a removed procedure, a removed or retyped output field, a new required input
      # field or a narrowed input type, and allows the removal of a procedure that the last release
      # marks deprecated or a break that libs/contract/accepted-breaks.txt names
      - name: Check that the contract only grows
        if: steps.last.outputs.tag != ''
        env:
          TAG: ${{ steps.last.outputs.tag }}
        run: |
          bun run --cwd libs/contract openapi
          git show "$TAG:libs/contract/openapi.json" > "$RUNNER_TEMP/last-openapi.json"
          .github/scripts/check-contract-growth.sh "$RUNNER_TEMP/last-openapi.json" \
            libs/contract/openapi.json libs/contract/accepted-breaks.txt

      - name: Check the migrations since the last release
        env:
          TAG: ${{ steps.last.outputs.tag }}
        run: |
          if [[ -n $TAG ]]; then
            .github/scripts/read-released-schema.sh "$TAG" "$RUNNER_TEMP/released.json"
            bun libs/db/src/run-migration-check.ts --released "$RUNNER_TEMP/released.json" \
              --last-tag "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            bun libs/db/src/run-migration-check.ts | tee -a "$GITHUB_STEP_SUMMARY"
          fi
