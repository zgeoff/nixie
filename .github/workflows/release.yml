# Cuts a nixie release. On every push to main, release-please opens or updates the release pull
# request, and merging it creates the v<version> tag and the GitHub release. The release commit then
# goes through one stage per job, each after the one before succeeds: the sandbox images, the nixie
# image with their digests, the web image, the migrations and the config schema in the release
# notes, a pull of each sandbox image with no credentials, the version tag on every image, and the
# release.json, config.schema.json and definitions-manifest.schema.json assets.
#
# A manual run on a release tag rebuilds that release from its commit. Re-running the failed
# jobs of a run resumes from the stage that failed with the same digests.
name: Release

on:
  push:
    branches: [main]
  # run on a release tag, so the attestations record the release commit as the source:
  # gh workflow run release.yml --ref v<version>
  workflow_dispatch:

permissions: {}

# a release in progress always finishes
concurrency:
  group: release
  cancel-in-progress: false

# an explicit bash runs each step with pipefail, so a failure inside a pipeline fails the step
defaults:
  run:
    shell: bash

jobs:
  # a manual run skips the steps rather than the job, because GitHub skips every job downstream of
  # a skipped one
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # a pull request that GITHUB_TOKEN opens runs no workflow, so the release pull request
      # would never run the checks that main requires
      - name: Mint the release App token
        id: token
        if: github.event_name == 'push'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve:
    needs: release-please
    if: >-
      github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created ==
      'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # the attestations take the source commit from the run, so the run's commit must be the
      # release commit
      - name: Resolve the release
        id: release
        env:
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
          CREATED_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            if [[ $GITHUB_REF_TYPE != tag ]]; then
              echo "::error::start a manual run on a release tag: gh workflow run release.yml --ref v<version>"
              exit 1
            fi
            tag=$GITHUB_REF_NAME
          else
            tag=$CREATED_TAG
            if [[ $CREATED_SHA != "$GITHUB_SHA" ]]; then
              echo "::error::release-please tagged $CREATED_SHA, not this run's commit $GITHUB_SHA. Rebuild with: gh workflow run release.yml --ref $tag"
              exit 1
            fi
          fi
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a release tag of the form v<major>.<minor>.<patch>"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # a tagged image may already be pinned, and a rebuild would give its tag another digest; the
      # tag stage refuses that too, and this stops the run before it builds anything
      - name: Refuse a version that an image already carries
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for image in nixie-conversation nixie-fetch nixie nixie-web; do
            if docker buildx imagetools inspect "ghcr.io/$OWNER/$image:$VERSION" > /dev/null 2>&1; then
              echo "::error::ghcr.io/$OWNER/$image:$VERSION already exists, so the release refuses to rebuild it"
              exit 1
            fi
          done

  conversation:
    needs: resolve
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      image: nixie-conversation
      dockerfile: guests/conversation/Dockerfile
      sha: ${{ needs.resolve.outputs.sha }}

  fetch:
    needs: resolve
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      image: nixie-fetch
      dockerfile: guests/fetch/Dockerfile
      sha: ${{ needs.resolve.outputs.sha }}

  sandbox-manifest:
    needs: [resolve, conversation, fetch]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      json: ${{ steps.manifest.outputs.json }}
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Build the sandbox manifest
        id: manifest
        env:
          CONVERSATION: ${{ needs.conversation.outputs.ref }}
          FETCH: ${{ needs.fetch.outputs.ref }}
        run: |
          json=$(.github/scripts/build-sandbox-manifest.sh "$CONVERSATION" "$FETCH")
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "$json" >> "$GITHUB_STEP_SUMMARY"

  nixie:
    needs: [resolve, sandbox-manifest]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      image: nixie
      dockerfile: apps/server/Dockerfile
      sha: ${{ needs.resolve.outputs.sha }}
      sandbox-manifest: ${{ needs.sandbox-manifest.outputs.json }}

  web:
    needs: [resolve, nixie]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      image: nixie-web
      dockerfile: apps/web/Dockerfile
      sha: ${{ needs.resolve.outputs.sha }}

  notes:
    needs: [resolve, conversation, fetch, nixie, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      migrations: ${{ steps.notes.outputs.migrations }}
      config-schema: ${{ steps.notes.outputs.config-schema }}
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # the config schema check compares with the last release's committed schema, and a release
      # before the first one that commits it has none
      - name: Append the migrations, the config schema and the images to the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CONVERSATION: ${{ needs.conversation.outputs.ref }}
          FETCH: ${{ needs.fetch.outputs.ref }}
          NIXIE: ${{ needs.nixie.outputs.ref }}
          WEB: ${{ needs.web.outputs.ref }}
        run: |
          body="$RUNNER_TEMP/body.md"
          gh release view "$TAG" --json body --jq .body > "$body"
          migrations="$RUNNER_TEMP/migrations.json"
          config_schema="$RUNNER_TEMP/config-schema.json"
          last=$(git describe --tags --abbrev=0 --match 'v*' "$SHA^" 2> /dev/null || true)
          if [[ -n $last ]]; then
            .github/scripts/read-released-schema.sh "$last" "$RUNNER_TEMP/released.json"
            bun libs/db/src/run-migration-check.ts --released "$RUNNER_TEMP/released.json" \
              --last-tag "$last" --release-body "$body" --summary "$migrations"
          else
            bun libs/db/src/run-migration-check.ts --release-body "$body" --summary "$migrations"
          fi
          released_config="$RUNNER_TEMP/released-config.schema.json"
          if [[ -n $last ]] && git show "$last:apps/server/config.schema.json" > "$released_config" 2> /dev/null; then
            bun apps/server/src/run-config-schema-check.ts --released "$released_config" \
              --last-tag "$last" --release-body "$body" --summary "$config_schema"
          else
            bun apps/server/src/run-config-schema-check.ts --release-body "$body" \
              --summary "$config_schema"
          fi
          {
            echo "migrations=$(jq -c . "$migrations")"
            echo "config-schema=$(jq -c . "$config_schema")"
          } >> "$GITHUB_OUTPUT"
          {
            echo
            echo '## Images'
            echo
            printf -- '- `%s`\n' "$CONVERSATION" "$FETCH" "$NIXIE" "$WEB"
          } >> "$body"
          gh release edit "$TAG" --notes-file "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

  check-pulls:
    needs: [notes, conversation, fetch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull each sandbox image with no credentials
        env:
          CONVERSATION: ${{ needs.conversation.outputs.ref }}
          FETCH: ${{ needs.fetch.outputs.ref }}
        run: .github/scripts/check-public-pulls.sh "$CONVERSATION" "$FETCH"

  tag:
    needs: [resolve, check-pulls, conversation, fetch, nixie, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the sandbox images first and nixie last, so Renovate never sees a nixie version whose
      # images are untagged
      - name: Tag every image with the version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CONVERSATION: ${{ needs.conversation.outputs.ref }}
          FETCH: ${{ needs.fetch.outputs.ref }}
          NIXIE: ${{ needs.nixie.outputs.ref }}
          WEB: ${{ needs.web.outputs.ref }}
        run: .github/scripts/tag-images.sh "$VERSION" "$CONVERSATION" "$FETCH" "$WEB" "$NIXIE"

  # last, so a reader that finds release.json finds every image under its version tag
  assets:
    needs: [resolve, notes, tag, conversation, fetch, nixie, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # a re-run replaces the assets of an earlier attempt, so it publishes the same files
      - name: Publish release.json, the config schema and the definitions manifest schema
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CONVERSATION: ${{ needs.conversation.outputs.ref }}
          FETCH: ${{ needs.fetch.outputs.ref }}
          NIXIE: ${{ needs.nixie.outputs.ref }}
          WEB: ${{ needs.web.outputs.ref }}
          MIGRATIONS: ${{ needs.notes.outputs.migrations }}
          CONFIG_SCHEMA: ${{ needs.notes.outputs.config-schema }}
        run: |
          printf '%s\n' "$MIGRATIONS" > "$RUNNER_TEMP/migrations.json"
          printf '%s\n' "$CONFIG_SCHEMA" > "$RUNNER_TEMP/config-schema.json"
          bun apps/server/src/run-release-manifest.ts --version "$VERSION" --commit "$SHA" \
            --server "$NIXIE" --web "$WEB" --conversation "$CONVERSATION" --fetch "$FETCH" \
            --migrations "$RUNNER_TEMP/migrations.json" \
            --config-schema "$RUNNER_TEMP/config-schema.json" --out "$RUNNER_TEMP/release.json"
          .github/scripts/publish-release-assets.sh "$TAG" "$RUNNER_TEMP/release.json"
          {
            echo '## release.json'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/release.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
