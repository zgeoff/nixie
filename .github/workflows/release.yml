# Cuts a nixie release. On every push to main, release-please opens or updates the release pull
# request, and merging it creates the v<version> tag and the GitHub release. The release commit then
# goes through one stage per job, each after the one before succeeds: the sandbox images, the nixie
# image with their digests, the web image, the migrations and the config schema in the release
# notes, a pull of each sandbox image with no credentials, the version tag on every image, and the
# counting proxy binary, release.json, config.schema.json and definitions-manifest.schema.json
# assets, and last the Kubernetes component and the API contract on npm at the release's version.
#
# A manual run on a release tag rebuilds that release from its commit. Re-running the failed
# jobs of a run resumes from the stage that failed with the same digests.
name: Release

on:
  push:
    branches: [main]
  # run on a release tag, so the attestations record the release commit as the source:
  # gh workflow run release.yml --ref v<version>
  workflow_dispatch:

permissions: {}

# a release in progress always finishes
concurrency:
  group: release
  cancel-in-progress: false

# an explicit bash runs each step with pipefail, so a failure inside a pipeline fails the step
defaults:
  run:
    shell: bash

jobs:
  # a manual run skips the steps rather than the job, because GitHub skips every job downstream of
  # a skipped one
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # a pull request that GITHUB_TOKEN opens runs no workflow, so the release pull request
      # would never run the checks that main requires
      - name: Mint the release App token
        id: token
        if: github.event_name == 'push'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve:
    name: Resolve the release
    needs: release-please
    if: >-
      github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created ==
      'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-resolve
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Resolve the release
        id: release
        env:
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
          CREATED_SHA: ${{ needs.release-please.outputs.sha }}
        run: bun run --silent ci:release:resolve-release

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse a version that an image already carries
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.release.outputs.version }}
        run: bun run --silent ci:release:check-unused-version

  conversation:
    name: Release the conversation image
    needs: resolve
    concurrency:
      group: release-conversation
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      image: nixie-conversation
      dockerfile: guests/conversation/Dockerfile
      sha: ${{ needs.resolve.outputs.sha }}

  fetch:
    name: Release the fetch image
    needs: resolve
    concurrency:
      group: release-fetch
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      image: nixie-fetch
      dockerfile: guests/fetch/Dockerfile
      sha: ${{ needs.resolve.outputs.sha }}

  sandbox-manifest:
    name: Release the sandbox manifest
    needs: [resolve, conversation, fetch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-sandbox-manifest
      cancel-in-progress: false
    permissions: {}
    outputs:
      json: ${{ steps.manifest.outputs.json }}
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Build the sandbox manifest
        id: manifest
        env:
          CONVERSATION: ${{ needs.conversation.outputs.ref }}
          FETCH: ${{ needs.fetch.outputs.ref }}
        run: bun run --silent ci:release:record-sandbox-manifest

  nixie:
    name: Release the nixie image
    needs: [resolve, sandbox-manifest]
    concurrency:
      group: release-nixie
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      image: nixie
      dockerfile: apps/server/Dockerfile
      sha: ${{ needs.resolve.outputs.sha }}
      sandbox-manifest: ${{ needs.sandbox-manifest.outputs.json }}

  web:
    name: Release the web image
    needs: [resolve, nixie]
    concurrency:
      group: release-web
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      image: nixie-web
      dockerfile: apps/web/Dockerfile
      sha: ${{ needs.resolve.outputs.sha }}

  notes:
    name: Write the release notes
    needs: [resolve, conversation, fetch, nixie, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-notes
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      migrations: ${{ steps.notes.outputs.migrations }}
      config-schema: ${{ steps.notes.outputs.config-schema }}
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Append the migrations, the config schema and the images to the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CONVERSATION: ${{ needs.conversation.outputs.ref }}
          FETCH: ${{ needs.fetch.outputs.ref }}
          NIXIE: ${{ needs.nixie.outputs.ref }}
          WEB: ${{ needs.web.outputs.ref }}
        run: bun run --silent ci:release:write-release-notes

  check-pulls:
    name: Pull the release sandbox images with no credentials
    needs: [notes, conversation, fetch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-check-pulls
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull each sandbox image with no credentials
        env:
          CONVERSATION: ${{ needs.conversation.outputs.ref }}
          FETCH: ${{ needs.fetch.outputs.ref }}
        run: .github/scripts/check-public-pulls.sh "$CONVERSATION" "$FETCH"

  tag:
    name: Tag the release images
    needs: [resolve, check-pulls, conversation, fetch, nixie, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-tag
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the sandbox images first and nixie last, so Renovate never sees a nixie version whose
      # images are untagged
      - name: Tag every image with the version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CONVERSATION: ${{ needs.conversation.outputs.ref }}
          FETCH: ${{ needs.fetch.outputs.ref }}
          NIXIE: ${{ needs.nixie.outputs.ref }}
          WEB: ${{ needs.web.outputs.ref }}
        run: .github/scripts/tag-images.sh "$VERSION" "$CONVERSATION" "$FETCH" "$WEB" "$NIXIE"

  # last, so a reader that finds release.json finds every image under its version tag
  assets:
    name: Publish the release assets
    needs: [resolve, notes, tag, conversation, fetch, nixie, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-assets
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Publish the counting proxy binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: bun run --silent ci:release:publish-counting-proxy

      - name: Publish release.json, the config schema and the definitions manifest schema
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CONVERSATION: ${{ needs.conversation.outputs.ref }}
          FETCH: ${{ needs.fetch.outputs.ref }}
          NIXIE: ${{ needs.nixie.outputs.ref }}
          WEB: ${{ needs.web.outputs.ref }}
          MIGRATIONS: ${{ needs.notes.outputs.migrations }}
          CONFIG_SCHEMA: ${{ needs.notes.outputs.config-schema }}
        run: bun run --silent ci:release:publish-release-json

  # after the assets, so a package of a version reaches npm only once every image of that version
  # carries its tag; each package publishes in its own job, so one that fails leaves the other's
  npm-package:
    name: Publish ${{ matrix.package }} at the release version
    needs: [resolve, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-npm-package-${{ matrix.package }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [deploy/pulumi-k8s, libs/contract]
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # npm's trusted publishing needs npm 11.5.1 or later, which Node 24 bundles
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Publish the package
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: .github/scripts/publish-npm-package.sh "$PACKAGE" "$VERSION"
