# Starts the Compose recipe. It checks that each image the recipe pins by tag and digest resolves to
# that digest under that tag, then starts the recipe with CI's overlay, which swaps nixie's release
# image for the test build on the test sandbox, because the release image leaves the test sandbox
# out. It checks that nixie's health URL answers ready through the recipe's origin, and that the
# enrol service prints a sign-in code. A pull request runs it only when it changes a file the recipe
# or the test build reads; every push to main runs it in full.
name: Compose

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

# an explicit bash runs each step with pipefail, so a failure inside a pipeline fails the step
defaults:
  run:
    shell: bash
    working-directory: deploy/compose

jobs:
  changes:
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@sync-v33
    with:
      paths: |
        .github/workflows/compose.yml
        .bun-version
        .dockerignore
        bun.lock
        bunfig.toml
        package.json
        tsconfig*.json
        adapters/**
        apps/**
        deploy/compose/**
        guests/**
        libs/**
        modules/**
        preview/**
        scripts/compose/**
        scripts/lib/**

  recipe:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the log and stop steps need both file names to read compose.yaml, so this step runs before
      # any step that can fail
      - name: Write the throwaway secrets
        run: bun run --silent ci:compose:write-throwaway-secrets

      - name: Check each pinned tag against its digest
        run: bun run --silent ci:compose:check-pinned-digests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # the test build shares its layers with the Preview workflow's, through the preview scope
      - name: Build the test build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: ./deploy/compose
          files: |
            compose.yaml
            ci/compose.yaml
          load: true
          set: |
            nixie.cache-from=type=gha,scope=preview
            nixie.cache-to=type=gha,mode=max,scope=preview

      - name: Start the recipe
        run: docker compose -f compose.yaml -f ci/compose.yaml up --wait --wait-timeout 300

      - name: Check the health URL
        env:
          ORIGIN: http://127.0.0.1:8080
        run: bun run --silent ci:compose:check-health-url

      - name: Check the age key
        run: bun run --silent ci:compose:check-age-key

      - name: Check the sign-in code
        run: bun run --silent ci:compose:check-sign-in-code recipe

      - name: Show the logs
        if: failure()
        run: docker compose -f compose.yaml -f ci/compose.yaml logs --no-color

      - name: Stop the recipe
        if: always()
        run: docker compose -f compose.yaml -f ci/compose.yaml down --volumes
