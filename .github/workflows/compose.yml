# Starts the Compose recipe. It checks that each image the recipe pins by tag and digest resolves to
# that digest under that tag, then starts the recipe with CI's overlay, which swaps nixie's release
# image for the test build on the test sandbox, because the release image leaves the test sandbox
# out. It checks that nixie's health URL answers ready through the recipe's origin, and that the
# enrol service prints a sign-in code. It runs the backup container built from the checkout, checks
# that nixie records a shipped set, and checks that the backup passwords and nixie's secrets stay in
# their own services. The recipe job is a required check, and GitHub counts a
# skipped job as a pass, so the job runs on every pull request; on a pull request that changes no
# file the recipe or the test build reads, each of its steps skips. A pull request runs the digest
# check only when it changes the recipe or that check; every push to main runs it in full.
name: Compose

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

# an explicit bash runs each step with pipefail, so a failure inside a pipeline fails the step
defaults:
  run:
    shell: bash
    working-directory: deploy/compose

jobs:
  changes:
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@931e0b748396d6ed4bca8531eacba01cc506dcb0 # main
    with:
      paths: |
        .github/workflows/compose.yml
        .bun-version
        .dockerignore
        bun.lock
        bunfig.toml
        package.json
        tsconfig*.json
        adapters/**
        apps/**
        deploy/compose/**
        guests/**
        libs/**
        modules/**
        preview/**
        scripts/compose/**
        scripts/lib/**

  # an upstream rebuild of a pinned tag moves its digest with no commit here, so only a pull request
  # that changes the recipe or the check runs the digest check, and main catches the drift
  pins:
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@931e0b748396d6ed4bca8531eacba01cc506dcb0 # main
    with:
      paths: |
        .github/workflows/compose.yml
        deploy/compose/**
        scripts/compose/check-pinned-digests.ts
        scripts/lib/**

  # a required check, so the job always runs and its steps skip instead; != 'false', so a failed
  # changes job still runs the recipe
  recipe:
    needs: [changes, pins]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RECIPE_CHANGED: ${{ needs.changes.outputs.changed != 'false' }}
    steps:
      - name: Report the skip
        if: ${{ env.RECIPE_CHANGED != 'true' }}
        working-directory: .
        run: echo "This change touches no file the recipe reads, so the recipe check skips."

      - name: Checkout
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the log and stop steps need both file names to read compose.yaml, so this step runs before
      # any step that can fail
      - name: Write the throwaway secrets
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        run: bun run --silent ci:compose:write-throwaway-secrets

      - name: Check each pinned tag against its digest
        if: ${{ env.RECIPE_CHANGED == 'true' && needs.pins.outputs.changed != 'false' }}
        run: bun run --silent ci:compose:check-pinned-digests

      - name: Set up Buildx
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # the test build shares its layers with the Preview workflow's, through the preview scope
      - name: Build the test build
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: ./deploy/compose
          files: |
            compose.yaml
            ci/compose.yaml
          load: true
          set: |
            nixie.cache-from=type=gha,scope=preview
            nixie.cache-to=type=gha,mode=max,scope=preview

      - name: Start the recipe
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        run: docker compose -f compose.yaml -f ci/compose.yaml up --wait --wait-timeout 300

      - name: Check the health URL
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        env:
          ORIGIN: http://127.0.0.1:8080
        run: bun run --silent ci:compose:check-health-url

      - name: Check the age key
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        run: bun run --silent ci:compose:check-age-key

      - name: Check the sign-in code
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        run: bun run --silent ci:compose:check-sign-in-code recipe

      # nixie stages a set at start, the backup container ships it, and nixie records its receipt on
      # its next pass, within its 60 s poll
      - name: Check that a backup set ships
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        run: |
          for _ in $(seq 60); do
            if docker compose -f compose.yaml -f ci/compose.yaml logs --no-color nixie | grep -F '"backup.set_published"'; then
              docker compose -f compose.yaml -f ci/compose.yaml logs --no-color nixie | grep -F '"backup.set_published"' | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::nixie recorded no published backup set within 300 s'
          exit 1

      # the backup passwords reach only the backup container, and nixie's secrets never reach it
      - name: Check the backup credentials stay apart
        if: ${{ env.RECIPE_CHANGED == 'true' }}
        run: |
          config=$(docker compose -f compose.yaml -f ci/compose.yaml config --format json)
          if jq -e '.services.nixie.environment // {} | keys | any(startswith("NIXIE_BACKUP_"))' <<< "$config"; then
            echo '::error::the nixie service holds a backup variable'
            exit 1
          fi
          if jq -e '.services.backup.volumes | any(.source == "secrets")' <<< "$config"; then
            echo '::error::the backup service mounts the secrets volume'
            exit 1
          fi
          jq -e '.services.backup.volumes | length == 1 and .[0].source == "data" and .[0].volume.subpath == "backup"' <<< "$config"

      - name: Show the logs
        if: ${{ failure() && env.RECIPE_CHANGED == 'true' }}
        run: docker compose -f compose.yaml -f ci/compose.yaml logs --no-color

      - name: Stop the recipe
        if: ${{ always() && env.RECIPE_CHANGED == 'true' }}
        run: docker compose -f compose.yaml -f ci/compose.yaml down --volumes
