# Runs ShellCheck and shfmt over the shell scripts nixie owns, at pinned versions with their
# published hashes, so what the check reports does not move with the runner image. The scripts that
# repo-sync delivers under .claude/ and .agents/skills/ stay out.
name: shell

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SHFMT_VERSION: v3.13.1
  SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6

jobs:
  lint:
    name: shell / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install shfmt and shellcheck
        run: bash scripts/install-shell-tools.sh

      - name: Shell Lint
        run: bun run lint:shell
