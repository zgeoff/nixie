# Starts the preview recipe as a preview environment starts it: it builds the images, waits for
# every service to report healthy, checks that nixie's health URL answers ready through the
# preview's one origin, and that the enrol service printed a sign-in code. A pull request runs it
# only when it changes a file the preview reads; every push to main runs it in full.
name: Preview

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

# an explicit bash runs each step with pipefail, so a failure inside a pipeline fails the step
defaults:
  run:
    shell: bash
    working-directory: preview

jobs:
  changes:
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@88652ed5edec35150703d1552645798c24376b71 # main
    with:
      paths: |
        .github/workflows/preview.yml
        .bun-version
        .dockerignore
        bun.lock
        bunfig.toml
        package.json
        tsconfig*.json
        adapters/**
        apps/**
        guests/**
        libs/**
        modules/**
        preview/**
        scripts/compose/**
        scripts/lib/**

  compose:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # the web image shares its layers with the Images workflow's web build through the web scope,
      # and the test build with the Compose workflow's through the preview scope
      - name: Build the images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: ./preview
          files: compose.yaml
          load: true
          set: |
            nixie.cache-from=type=gha,scope=preview
            nixie.cache-to=type=gha,mode=max,scope=preview
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,mode=max,scope=web

      - name: Start the preview
        run: docker compose up --wait --wait-timeout 300

      - name: Check the health URL
        env:
          ORIGIN: http://127.0.0.1:8080
        run: bun run --silent ci:compose:check-health-url

      - name: Check the sign-in code
        run: bun run --silent ci:compose:check-sign-in-code preview

      - name: Show the logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the preview
        if: always()
        run: docker compose down --volumes
