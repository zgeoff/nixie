# Runs the shared Bun checks on every push to main, with the script list that
# the BUN_CHECK_SCRIPTS repo variable sets for pull requests.
name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

# Keyed by commit and never cancelled, so every push to main is tested; two
# runs of one commit, such as a rerun, wait for each other.
concurrency:
  group: main-checks-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    # GitHub checks the called workflow's job permissions even for its skipped
    # gitleaks job, which asks for pull-requests: write
    permissions:
      contents: read
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/bun-checks.yml@6376469851b52802942c9a70a32602d80caca6d1 # main
    with:
      scripts: ${{ vars.BUN_CHECK_SCRIPTS }}
      # the pull request that landed the commits already scanned them
      gitleaks: false
