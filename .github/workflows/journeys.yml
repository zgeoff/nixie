# Drives the user's core journeys through the built web app in Chrome, against a running nixie:
# signing in, a chat turn, approving a memory proposal and a reset. A pull request runs them only
# when it changes a file the server, the web app or the journeys read. journeys-main.yml runs them
# on every push to main.
name: Journeys

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@1362e73442ada37519065d81d0b38612516e682f # main
    with:
      paths: |
        .github/workflows/journeys.yml
        .bun-version
        bun.lock
        bunfig.toml
        package.json
        rig.config.ts
        tsconfig*.json
        adapters/**
        apps/**
        guests/**
        libs/**
        modules/**

  journeys:
    needs: changes
    # != 'false', so a failed changes job still runs the journeys
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI never commits; skip hook install and execution.
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the install runs the web app's style codegen, which its build reads
      - name: Install
        run: bun install --frozen-lockfile

      - name: Journeys
        run: bun run test:journeys
