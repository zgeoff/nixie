# Rehearses the release's image stages against a registry that lives only for the job: it builds
# each image as the release does, writes the sandbox manifest from the sandbox digests, checks that
# the nixie image carries it, then runs the release's pull check, tag stage and assets stage. A
# broken Dockerfile or a changed checksum then fails the pull request, never a release. A pull
# request runs it only when it changes a file the images or the stages read; every push to main runs
# it in full.
name: Images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

# an explicit bash runs each step with pipefail, so a failure inside a pipeline fails the step
defaults:
  run:
    shell: bash

jobs:
  changes:
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@sync-v29
    with:
      paths: |
        .github/workflows/images.yml
        .github/actions/build-image/**
        .github/scripts/**
        .bun-version
        .dockerignore
        bun.lock
        bunfig.toml
        package.json
        tsconfig*.json
        adapters/**
        apps/**
        guests/**
        libs/**
        modules/**
        scripts/images/**
        scripts/lib/**

  rehearse:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      registry:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    env:
      REGISTRY: localhost:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the builder shares the host network, so it reaches the job's registry on localhost
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Build the conversation image
        id: conversation
        uses: ./.github/actions/build-image
        with:
          repository: ${{ env.REGISTRY }}/nixie-conversation
          dockerfile: guests/conversation/Dockerfile
          cache-scope: conversation

      - name: Build the fetch image
        id: fetch
        uses: ./.github/actions/build-image
        with:
          repository: ${{ env.REGISTRY }}/nixie-fetch
          dockerfile: guests/fetch/Dockerfile
          cache-scope: fetch

      # before the sandbox manifest is written, so its context is the checkout, as in the Preview
      # workflow's web build, and the two share their layers through the web scope
      - name: Build the web image
        id: web
        uses: ./.github/actions/build-image
        with:
          repository: ${{ env.REGISTRY }}/nixie-web
          dockerfile: apps/web/Dockerfile
          cache-scope: web

      - name: Write the sandbox manifest
        id: manifest
        env:
          CONVERSATION:
            ${{ env.REGISTRY }}/nixie-conversation@${{ steps.conversation.outputs.digest }}
          FETCH: ${{ env.REGISTRY }}/nixie-fetch@${{ steps.fetch.outputs.digest }}
        run: bun run --silent ci:images:write-sandbox-manifest

      - name: Build the nixie image
        id: nixie
        uses: ./.github/actions/build-image
        with:
          repository: ${{ env.REGISTRY }}/nixie
          dockerfile: apps/server/Dockerfile
          cache-scope: nixie

      - name: Check that the nixie image carries the sandbox manifest
        env:
          NIXIE: ${{ env.REGISTRY }}/nixie@${{ steps.nixie.outputs.digest }}
        run: bun run --silent ci:images:check-carried-manifest

      - name: Check that the nixie command prints the sandbox images
        env:
          NIXIE: ${{ env.REGISTRY }}/nixie@${{ steps.nixie.outputs.digest }}
        run: bun run --silent ci:images:check-printed-sandbox-images

      # with no network, so the check passes only on the model files the image carries
      - name: Check that the nixie image loads its encoder offline
        env:
          NIXIE: ${{ env.REGISTRY }}/nixie@${{ steps.nixie.outputs.digest }}
        run: docker run --rm --network none --read-only "$NIXIE" check-encoder

      - name: Pull each sandbox image with no credentials
        env:
          CONVERSATION:
            ${{ env.REGISTRY }}/nixie-conversation@${{ steps.conversation.outputs.digest }}
          FETCH: ${{ env.REGISTRY }}/nixie-fetch@${{ steps.fetch.outputs.digest }}
        run: .github/scripts/check-public-pulls.sh "$CONVERSATION" "$FETCH"

      - name: Tag every image, twice, and keep each digest
        env:
          CONVERSATION:
            ${{ env.REGISTRY }}/nixie-conversation@${{ steps.conversation.outputs.digest }}
          FETCH: ${{ env.REGISTRY }}/nixie-fetch@${{ steps.fetch.outputs.digest }}
          NIXIE: ${{ env.REGISTRY }}/nixie@${{ steps.nixie.outputs.digest }}
          WEB: ${{ env.REGISTRY }}/nixie-web@${{ steps.web.outputs.digest }}
        run: bun run --silent ci:images:tag-rehearsal-images

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build release.json, check each image it names, and rehearse its upload
        env:
          CONVERSATION:
            ${{ env.REGISTRY }}/nixie-conversation@${{ steps.conversation.outputs.digest }}
          FETCH: ${{ env.REGISTRY }}/nixie-fetch@${{ steps.fetch.outputs.digest }}
          NIXIE: ${{ env.REGISTRY }}/nixie@${{ steps.nixie.outputs.digest }}
          WEB: ${{ env.REGISTRY }}/nixie-web@${{ steps.web.outputs.digest }}
        run: bun run --silent ci:images:rehearse-release-assets
