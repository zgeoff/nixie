# Runs the definitions format check on each push to main, as definitions-format.yml runs it on a
# pull request. A push to main keeps each run, so every merged commit gets its check.
name: definitions format main

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  task-yaml:
    name: definitions format / task-yaml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --silent ci:definitions:check-task-yaml-format
