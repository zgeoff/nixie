# Checks the config schema change that a pull request adds, against the schema on its base. A change
# that can refuse a config.yaml the base accepts passes only when the pull request title marks a
# breaking change with "!", because the squash merge makes the title the commit header and
# release-please lists such a commit under the changelog's breaking changes. Each pull request
# answers only for its own change, so a break that merged with its marker never fails a later one,
# and the release notes compare with the last release. A title edit re-runs the check.
name: Config schema

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: config-schema-${{ github.ref }}
  cancel-in-progress: true

# an explicit bash runs each step with pipefail, so a failure inside a pipeline fails the step
defaults:
  run:
    shell: bash

jobs:
  config-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the check imports nothing outside the repo, so it needs no install
      - name: Check the config schema against the base
        env:
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: bun run --silent ci:config-schema:run-config-schema-check
