# Drives the user's core journeys on each push to main, as journeys.yml drives them on a pull
# request. A push to main keeps each run, so every merged commit gets its journeys run.
name: Journeys main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  changes:
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@b8a2b5b46b6685b7c9143c3f6345a54c2de31ddd # main
    with:
      paths: |
        .github/workflows/journeys-main.yml
        .bun-version
        bun.lock
        bunfig.toml
        package.json
        rig.config.ts
        tsconfig*.json
        adapters/**
        apps/**
        guests/**
        libs/**
        modules/**

  journeys:
    needs: changes
    # != 'false', so a failed changes job still runs the journeys
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI never commits; skip hook install and execution.
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the install runs the web app's style codegen, which its build reads
      - name: Install
        run: bun install --frozen-lockfile

      - name: Journeys
        run: bun run test:journeys
