# Git hooks. pre-commit fixes staged files only (fast); pre-push checks what
# the branch changes, plus the cheap whole-tree gates. CI runs every
# whole-tree check: type-aware lint, dead code, and the full test suite.

pre-commit:
  piped: true
  jobs:
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,ts,mts,cts}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,ts,mts,cts,json,jsonc,md,yml,yaml}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # the exclude mirrors .formatignore: the tool exits 2 when every file
    # it is given is ignored, so ignored files must not reach it
    - name: format-codemod
      glob: '*.{ts,tsx}'
      exclude:
        - '.claude/hooks/skill-gate/**'
        - 'apps/web/src/routeTree.gen.ts'
        - 'apps/web/src/styled-system/**'
        - 'docs/design/**/spikes/**'
        - 'research/**'
        - '**/dist/**'
        - '**/coverage/**'
        - '.worktrees/**'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true
    # last so it scans what the fixers above re-staged; needs the gitleaks
    # binary on PATH (mise: `mise use -g gitleaks`)
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  # one job at a time, to bound memory on a small host
  piped: true
  jobs:
    # lefthook skips a job whose files command fails and still exits 0, so a
    # missing base ref would pass the push without linting anything
    - name: base ref
      run:
        git rev-parse --verify --quiet origin/main > /dev/null || { echo "pre-push needs
        origin/main; run git fetch origin main"; exit 1; }
    - name: format:check
      run: bun run format:check
    # the job lists the branch's files itself, so it runs on every push; a
    # files: list marks the job skipped when the branch changes no script
    - name: lint
      run:
        git diff --name-only -z --diff-filter=ACMR origin/main...HEAD -- '*.js' '*.mjs' '*.cjs'
        '*.ts' '*.mts' '*.cts' | xargs -0 -r node_modules/.bin/oxlint
        --no-error-on-unmatched-pattern
    # the packages the branch affects, one package and one checker at a time:
    # turbo's default 10 at once ran a 2 GiB host out of memory, and tsc's
    # default checkers take apps/server to about 1.2 GiB, one checker to 0.6
    - name: typecheck
      run:
        node_modules/.bin/tsc --noEmit --checkers 1 && TURBO_SCM_BASE=origin/main
        node_modules/.bin/turbo run typecheck --affected --concurrency=1 --output-logs=errors-only
        -- --checkers 1
    - name: boundaries
      run: bun run boundaries
    - name: prose
      run: bun run prose
    - name: test
      run: bun test --changed=origin/main
