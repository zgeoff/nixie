# Git hooks. pre-commit fixes staged files only (fast); pre-push checks what
# the push sends, plus the cheap whole-tree gates. CI runs every
# whole-tree check: type-aware lint, dead code, and the full test suite.

pre-commit:
  piped: true
  jobs:
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,ts,mts,cts}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,ts,mts,cts,json,jsonc,md,yml,yaml}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # the exclude mirrors .formatignore: the tool exits 2 when every file
    # it is given is ignored, so ignored files must not reach it
    - name: format-codemod
      glob: '*.{ts,tsx}'
      exclude:
        - '.claude/hooks/skill-gate/**'
        - 'apps/web/src/routeTree.gen.ts'
        - 'apps/web/src/styled-system/**'
        - 'docs/design/**/spikes/**'
        - 'research/**'
        - '**/dist/**'
        - '**/coverage/**'
        - '.worktrees/**'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true
    # last so it scans what the fixers above re-staged; needs the gitleaks
    # binary on PATH (mise: `mise use -g gitleaks`)
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  # one job at a time, to bound memory on a small host
  piped: true
  jobs:
    # lefthook skips a job whose files command fails and still exits 0, so a
    # missing base ref would pass the push without linting anything
    - name: base ref
      run:
        git rev-parse --verify --quiet origin/main > /dev/null || { echo "pre-push needs
        origin/main; run git fetch origin main"; exit 1; }
    # the pusher's own home directory and host name, which gitleaks cannot know;
    # a fixed /home/ pattern would refuse the sandbox paths the code uses. Every
    # outgoing commit is scanned, because a later commit's removal still pushes
    # the earlier one, and the host name matches only as a whole word
    - name: local paths
      use_stdin: true
      run: |
        commits=$(.lefthook/pushed-commits.sh) || exit 1
        for commit in $commits; do
          git merge-base origin/main "$commit" > /dev/null || exit 1
        done
        [ -n "$commits" ] || exit 0
        added=$(git log -p -U0 --format= $commits --not origin/main | grep '^+' | grep -v '^+++')
        host=$(uname -n)
        if printf '%s\n' "$added" | grep -F -e "$HOME/" ||
          { [ -n "$host" ] && [ "$host" != localhost ] && printf '%s\n' "$added" | grep -F -w -e "$host"; }; then
          echo "a commit on the branch adds your home directory or host name; remove it before you push"
          exit 1
        fi
    - name: format:check
      run: bun run format:check
    # the job lists the pushed commits' files itself, so it runs on every push;
    # a files: list marks the job skipped when the push changes no script.
    # Each merge base is resolved first, so a commit without one fails the job
    # rather than handing oxlint an empty list
    - name: lint
      use_stdin: true
      run: |
        commits=$(.lefthook/pushed-commits.sh) || exit 1
        for commit in $commits; do
          git merge-base origin/main "$commit" > /dev/null || exit 1
        done
        for commit in $commits; do
          git diff -z --name-only --diff-filter=ACMR "origin/main...$commit" -- '*.js' '*.mjs' '*.cjs' '*.jsx' '*.ts' '*.mts' '*.cts' '*.tsx'
        done | sort -zu | xargs -0 -r node_modules/.bin/oxlint --no-error-on-unmatched-pattern
    # the packages each pushed commit affects, one package and one checker at
    # a time: turbo's default 10 at once ran a 2 GiB host out of memory, and
    # tsc's default checkers take apps/server to about 1.2 GiB, one checker to
    # 0.6. A set TURBO_SCM_HEAD leaves the working tree's changes out
    - name: typecheck
      use_stdin: true
      run: |
        commits=$(.lefthook/pushed-commits.sh) || exit 1
        node_modules/.bin/tsc --noEmit --checkers 1 || exit 1
        for commit in $commits; do
          TURBO_SCM_BASE=origin/main TURBO_SCM_HEAD=$commit node_modules/.bin/turbo run typecheck --affected --concurrency=1 --output-logs=errors-only -- --checkers 1 || exit 1
        done
    - name: boundaries
      run: bun run boundaries
    - name: prose
      run: bun run prose
    # the tests each pushed commit's changes select, so a push of one stack layer from
    # the top layer's worktree runs that layer's tests only. Each test file runs in its own
    # process, as in CI, so a file's own MSW server never meets the web client's; one worker
    # at a time, because the host may have little memory
    - name: test
      use_stdin: true
      run: |
        commits=$(.lefthook/pushed-commits.sh) || exit 1
        for commit in $commits; do
          bun test --parallel=1 --changed="origin/main...$commit" || exit 1
        done
