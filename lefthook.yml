# Git hooks. pre-commit fixes staged files only (fast); pre-push runs nixie's
# own gates, then the baseline that @zgeoff/chex ships. CI runs every
# whole-tree check: type-aware lint, dead code, and the full test suite.

extends:
  - node_modules/@zgeoff/chex/lefthook.yml

pre-commit:
  piped: true
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,yml,yaml}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # the exclude mirrors .formatignore: the tool exits 2 when every file
    # it is given is ignored, so ignored files must not reach it
    - name: format-codemod
      glob: '*.{ts,tsx}'
      exclude:
        - '.claude/hooks/start.ts'
        - 'apps/web/src/routeTree.gen.ts'
        - 'apps/web/src/styled-system/**'
        - 'research/**'
        - '**/dist/**'
        - 'dist/**'
        - '**/coverage/**'
        - 'coverage/**'
        - '.worktrees/**'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true
    # last so it scans what the fixers above re-staged; needs the gitleaks
    # binary on PATH (mise: `mise use -g gitleaks`)
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  exclude_tags:
    - chex-test
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    # lefthook skips a job whose files command fails and still exits 0, so a
    # missing base ref would pass the push without the baseline's branch checks
    - name: base ref
      run:
        git rev-parse --verify --quiet origin/main > /dev/null || { echo "pre-push needs
        origin/main; run git fetch origin main"; exit 1; }
    - name: boundaries
      run: bun run boundaries
    - name: prose
      run: bun run prose
    # The baseline's chex-test job runs rig related alone, so exclude_tags
    # drops it and this job runs test:related, which builds the models and the
    # test bundles first. A bunfig.toml reaches the job too, because a change
    # to it skips the related tests.
    - name: test
      files:
        unset $(git rev-parse --local-env-vars); bun
        node_modules/@zgeoff/chex/src/read-branch-files.ts
      glob: '*.{ts,tsx,toml}'
      run: '{clear-git-env} bun x --no-install diet -- bun run test:related {files}'
