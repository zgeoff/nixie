<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/launcher-192.png" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Send page</title>
  </head>
  <body>
    <nav>
      <a href="/">Home</a><a href="/block-1.html">Block 1</a><a href="/block-2.html">Block 2</a
      ><a href="/block-6.html">Block 6</a><a href="/block-7.html">Block 7</a><a href="/log.html">Log</a>
    </nav>
    <h1>Send page</h1>
    <p id="session" class="status">Session: loading</p>
    <p>
      Open this page on the PC that runs the server, from the address the server prints. It sends
      to every subscribed phone and shows every session's log.
    </p>
    <h2>Pair a phone</h2>
    <button id="make-pairing">Make a pairing code</button>
    <p id="pairing" class="status"></p>
    <h2>Subscriptions</h2>
    <ul id="subscriptions" class="log"></ul>
    <h2>Send</h2>
    <label>Title <input id="title" value="nixie probe" /></label>
    <label>Delay, seconds <input id="delay" type="number" min="0" max="3600" value="0" /></label>
    <label
      >Urgency
      <select id="urgency">
        <option>normal</option>
        <option>high</option>
        <option>low</option>
        <option>very-low</option>
      </select></label
    >
    <label>Tag <input id="tag" value="" placeholder="empty: no tag" /></label>
    <label><input id="silent" type="checkbox" /> silent</label>
    <label><input id="renotify" type="checkbox" /> renotify (needs a tag)</label>
    <label><input id="approve" type="checkbox" /> Approve and Open buttons (block 2)</label>
    <button id="send">Send</button>
    <p id="send-result" class="status"></p>
    <h2>Log, every session</h2>
    <ul id="log" class="log"></ul>
    <script type="module" src="/assets/send.js"></script>
  </body>
</html>
