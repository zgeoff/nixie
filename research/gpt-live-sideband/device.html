<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gpt-live-sideband device</title>
  </head>
  <body>
    <audio id="speaker" autoplay></audio>
    <script type="module">
      // The stand-in for the carrying device: one peer connection whose microphone is a WebAudio
      // destination the runner plays synthetic speech into, and a meter on the speech it receives.
      const context = new AudioContext({ sampleRate: 48000 });
      const microphone = context.createMediaStreamDestination();
      const device = { events: [], levels: [], peer: undefined, channel: undefined };
      window.device = device;

      function openPeer() {
        const peer = new RTCPeerConnection();
        for (const track of microphone.stream.getAudioTracks()) {
          peer.addTrack(track, microphone.stream);
        }
        peer.addEventListener('track', (event) => {
          const stream = new MediaStream([event.track]);
          document.getElementById('speaker').srcObject = stream;
          const analyser = context.createAnalyser();
          analyser.fftSize = 1024;
          context.createMediaStreamSource(stream).connect(analyser);
          const samples = new Float32Array(analyser.fftSize);
          setInterval(() => {
            analyser.getFloatTimeDomainData(samples);
            let peak = 0;
            for (const sample of samples) peak = Math.max(peak, Math.abs(sample));
            device.levels.push({ atMs: Date.now(), peak });
          }, 20);
        });
        peer.addEventListener('connectionstatechange', () =>
          device.events.push({ atMs: Date.now(), source: 'peer', state: peer.connectionState }),
        );
        const channel = peer.createDataChannel('oai-events');
        channel.addEventListener('message', ({ data }) =>
          device.events.push({ atMs: Date.now(), source: 'data_channel', event: JSON.parse(data) }),
        );
        device.peer = peer;
        device.channel = channel;
        return peer;
      }

      async function makeOffer(peer, options) {
        await peer.setLocalDescription(await peer.createOffer(options));
        if (peer.iceGatheringState !== 'complete') {
          await new Promise((resolve) => {
            const onState = () => peer.iceGatheringState === 'complete' && resolve(undefined);
            peer.addEventListener('icegatheringstatechange', onState);
            setTimeout(resolve, 5000);
          });
        }
        return peer.localDescription.sdp;
      }

      window.createOffer = async () => {
        await context.resume();
        return makeOffer(openPeer());
      };
      window.createRestartOffer = () => makeOffer(device.peer, { iceRestart: true });
      window.applyAnswer = (sdp) => device.peer.setRemoteDescription({ type: 'answer', sdp });
      window.closePeer = () => device.peer?.close();
      window.sendOnChannel = (event) => device.channel.send(JSON.stringify(event));

      // Plays mono PCM16 at 24 kHz into the microphone, and resolves with its start and end times.
      window.speak = (base64) =>
        new Promise((resolve) => {
          const bytes = Uint8Array.from(atob(base64), (char) => char.charCodeAt(0));
          const pcm = new Int16Array(bytes.buffer);
          const buffer = context.createBuffer(1, pcm.length, 24000);
          const channelData = buffer.getChannelData(0);
          for (let index = 0; index < pcm.length; index++) channelData[index] = pcm[index] / 32768;
          const source = context.createBufferSource();
          source.buffer = buffer;
          source.connect(microphone);
          const startedAtMs = Date.now();
          source.addEventListener('ended', () => resolve({ startedAtMs, endedAtMs: Date.now() }));
          source.start();
        });
    </script>
  </body>
</html>
