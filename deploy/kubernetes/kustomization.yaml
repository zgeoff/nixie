# The reference manifests for nixie on Kubernetes. A deployment repo keeps its own copy, and sets
# the host name, impd's URL, the address ranges and the model profiles for its own cluster. The
# Secret that holds nixie's secrets file and its age key comes from the deployment repo, never from
# this folder: secret.example.yaml shows its shape.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nixie
resources:
  - namespace.yaml
  - config.yaml
  - nixie.yaml
  - web.yaml
  - ingress.yaml
