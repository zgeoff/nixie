# The shape of the Secret that nixie's pod mounts read-only at /etc/nixie. kustomization.yaml leaves
# this file out, so applying the folder never replaces a real Secret. Create the real one from the
# deployment repo's sops file and the host's age key, as a generic Secret named nixie-secrets in
# the nixie namespace with the key secrets.yaml from <sops_file> and age.key from <age_key_file>.
# nixie decrypts secrets.yaml in its own process at start and keeps the plaintext in memory only.
apiVersion: v1
kind: Secret
metadata:
  name: nixie-secrets
  namespace: nixie
  labels:
    app.kubernetes.io/name: nixie
    app.kubernetes.io/component: server
type: Opaque
immutable: true
stringData:
  secrets.yaml: |
    deployment_key: <sops_encrypted_value>
    impd_token: <sops_encrypted_value>
    # only when the configuration sets definitions.export
    definitions_export_token: <sops_encrypted_value>
    model_credentials:
      anthropic: <sops_encrypted_value>
    sops:
      age:
        - recipient: <host_age_recipient>
        - recipient: <recovery_age_recipient>
  age.key: <host_age_private_key>
