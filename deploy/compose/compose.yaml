# The reference Compose recipe: nixie and the web client from one release, each named by its version
# tag and digest, and one Caddy origin in front of both. impd runs on the host as its own stack,
# outside this file, and nixie reaches it outbound by the URL in config.yaml. Run it from this
# folder, with the paths of your sops file and your host's age key:
#   NIXIE_SECRETS_FILE=<sops_file> NIXIE_AGE_KEY_FILE=<age_key_file> docker compose up --wait
name: nixie

services:
  # Gives the data volume to nixie's user, and copies the sops file and the age key into a volume
  # that only that user reads, mode 0400. Docker creates each volume owned by root, and the host's
  # files keep their host owner and mode, so nixie's user could otherwise read neither. It runs on
  # every start, so a changed file on the host reaches nixie at the next up.
  setup:
    image: ghcr.io/zgeoff/nixie:0.28.0@sha256:61dac2ebd9ecf4c9cbe269b7689b960b17464b8a85ce394e1ca15d440edd8ebd
    user: '0:0'
    entrypoint:
      - sh
      - -euc
      - |
        chown 10001:10001 /data
        chown 0:10001 /secrets
        chmod 0750 /secrets
        umask 077
        for name in secrets.yaml age.key; do
          rm -f "/secrets/$$name"
          cp "/host/$$name" "/secrets/$$name"
          chmod 0400 "/secrets/$$name"
          chown 10001:10001 "/secrets/$$name"
        done
    volumes:
      - data:/data
      - secrets:/secrets
      - ${NIXIE_SECRETS_FILE:?set NIXIE_SECRETS_FILE to your sops file}:/host/secrets.yaml:ro
      - ${NIXIE_AGE_KEY_FILE:?set NIXIE_AGE_KEY_FILE to your host's age key}:/host/age.key:ro
    network_mode: none
    # CHOWN gives each file to nixie's user, and DAC_READ_SEARCH reads host files that root does
    # not own
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'DAC_READ_SEARCH']
    restart: 'no'

  nixie:
    image: ghcr.io/zgeoff/nixie:0.28.0@sha256:61dac2ebd9ecf4c9cbe269b7689b960b17464b8a85ce394e1ca15d440edd8ebd
    command: ['serve']
    environment:
      # sops finds the age key here when nixie decrypts its secrets file at start
      SOPS_AGE_KEY_FILE: /etc/nixie/secrets/age.key
    # the configuration, the definitions, and setup's copies of the sops file and its age key, all
    # read-only; nixie decrypts the file in its own process and keeps the plaintext in memory only
    volumes:
      - data:/data
      - ./config.yaml:/etc/nixie/config.yaml:ro
      - ./definitions:/etc/nixie/definitions:ro
      - secrets:/etc/nixie/secrets:ro
    tmpfs:
      - /tmp:size=16m
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    # past the runner pools' 30 s grace, so a stop lets the steps in flight commit
    stop_grace_period: 45s
    depends_on:
      setup:
        condition: service_completed_successfully

  # prints a code that signs one device in; start it with docker compose run --rm enrol
  enrol:
    image: ghcr.io/zgeoff/nixie:0.28.0@sha256:61dac2ebd9ecf4c9cbe269b7689b960b17464b8a85ce394e1ca15d440edd8ebd
    command: ['enrol-code']
    profiles: ['enrol']
    volumes:
      - data:/data
      - ./config.yaml:/etc/nixie/config.yaml:ro
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    depends_on:
      nixie:
        condition: service_healthy

  web:
    image: ghcr.io/zgeoff/nixie-web:0.28.0@sha256:e7b71769279c61638dedae25f2dc2d6d7df34c1d1dec46f6529c23ad6bf19c4d
    environment:
      NIXIE_API_URL: http://nixie:8080
    tmpfs:
      - /tmp:size=16m
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    depends_on:
      nixie:
        condition: service_healthy

  proxy:
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # loopback by default, so only the host reaches the origin; set NIXIE_BIND to a private address
    ports:
      - ${NIXIE_BIND:-127.0.0.1}:${NIXIE_PORT:-8080}:8080
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

volumes:
  data:
  secrets:
