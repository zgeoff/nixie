# CI's overlay on the recipe: it swaps nixie's release image for the preview's test build and selects
# the test sandbox, so the recipe starts with no impd. The test sandbox runs each guest as a local
# process with no isolation, so this overlay is never a deployment. CI runs it from the folder above:
#   docker compose -f compose.yaml -f ci/compose.yaml up --build --wait
# NIXIE_SECRETS_FILE names a plain secrets file, which the test build's stand-in for sops reads.
x-test-build: &test-build
  image: nixie-compose-test:local
  entrypoint: ['bun', '--define', 'NIXIE_TEST_BUILD=true', '/app/apps/server/src/main.ts']

services:
  nixie:
    <<: *test-build
    build:
      context: ../..
      dockerfile: preview/Dockerfile
    command:
      - serve
      - --manifest=/app/preview/sandbox-manifest.json
      - --sops=/app/preview/run-plain-sops.sh
      - --encoder=/app/node_modules/.cache/nixie-encoder
    volumes:
      - ./ci/config.yaml:/etc/nixie/config.yaml:ro
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '--define',
          'NIXIE_TEST_BUILD=true',
          '/app/apps/server/src/main.ts',
          'health',
        ]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24

  enrol:
    <<: *test-build
    volumes:
      - ./ci/config.yaml:/etc/nixie/config.yaml:ro

  # the backup job, built from this checkout, ships each staged set to two repositories in a volume
  # of its own; it mounts only the staging folder, and holds the backup passwords and no secrets
  backup:
    image: nixie-backup-compose-test:local
    build:
      context: ../..
      dockerfile: apps/backup-job/Dockerfile
    command: ['loop']
    environment:
      HOME: /tmp
      NIXIE_BACKUP_POLL_SECONDS: '5'
      NIXIE_BACKUP_DATA_REPOSITORY: /repos/data
      NIXIE_BACKUP_DATA_PASSWORD: invented-data-password
      NIXIE_BACKUP_KEY_REPOSITORY: /repos/keys
      NIXIE_BACKUP_KEY_PASSWORD: invented-key-password
    volumes:
      - type: volume
        source: data
        target: /backup
        volume:
          subpath: backup
    # the job's user owns the repositories, which Docker would create owned by root in a volume
    tmpfs:
      - /tmp:size=16m
      - /repos:size=256m,uid=10001,gid=10001,mode=0700
    read_only: true
    network_mode: none
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
