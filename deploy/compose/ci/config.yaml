# The recipe's configuration on the test sandbox, which runs every guest as a local process beside
# nixie, so CI starts the recipe with no impd. It holds invented data only.
server:
  data_dir: /data
  port: 8080
  secrets_file: /etc/nixie/secrets/secrets.yaml
models:
  profiles:
    chat:
      harness: agent-sdk
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: x-api-key
      model: claude-haiku-5-5
      effort: low
      # Anthropic's list prices for Claude Haiku 5.5, in US dollars per million tokens, from
      # https://platform.claude.com/docs/en/about-claude/pricing: the base set for a prompt up to
      # 100,000 tokens and the long-prompt set for a longer one
      prices:
        input: 0.1
        cache_write: 0.125
        cache_write_1h: 0.2
        cached_input: 0.01
        output: 0.5
        long_prompt:
          over_tokens: 100000
          input: 0.5
          cache_write: 0.625
          cache_write_1h: 1
          cached_input: 0.05
          output: 2.5
  roles:
    conversation: chat
sandbox:
  adapter: test
definitions:
  source:
    kind: path
    path: /etc/nixie/definitions
