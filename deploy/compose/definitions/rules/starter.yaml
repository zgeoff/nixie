# The starter rules. Copy them into your own definitions repo and edit them there.
# The first seed applies every rule here at once.

allow-reads:
  outcome: allow
  effects: [read, fetch]
  note: Reading and fetching change nothing.

allow-notes:
  outcome: allow
  effects: [note]

allow-service-writes:
  outcome: allow
  effects: [write]
  note: The service can restore what a write changes.

allow-sends-within-limits:
  outcome: allow
  effects: [send]
  note: The destination limits still bound every send.

allow-sandboxed-code:
  outcome: allow
  effects: [code_run]

allow-take-back:
  outcome: allow
  effects: [computer_take_back]
  note: The user is at the screen, and a hand-back only returns the computer to the assistant.

# Shell commands that only read. Each rule allows a line only when every command on it is that one
# command, with plain words and no redirection, substitution or variable.
allow-shell-cat:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'cat *' }

allow-shell-df:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'df *' }

allow-shell-du:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'du *' }

allow-shell-grep:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'grep *' }

allow-shell-head:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'head *' }

allow-shell-ls:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'ls *' }

allow-shell-pwd:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'pwd *' }

allow-shell-stat:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'stat *' }

allow-shell-tail:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'tail *' }

allow-shell-wc:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'wc *' }

allow-shell-which:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - { arg: command, op: matches, value: 'which *' }

allow-narrowing:
  outcome: allow
  effects: [policy_narrow, budget_lower]

ask-permanent-deletes:
  outcome: ask
  effects: [delete]

ask-exports:
  outcome: ask
  effects: [export]
  note: An export, such as a memory or event log export, leaves nixie.

ask-stranger-with-memory:
  outcome: ask
  tools: [task.start/sandbox]
  checks:
    - { arg: persona, op: eq, value: none }
    - { arg: memory, op: eq, value: read }
  note: A task without the persona reads your memory only with your approval.

ask-coding-sessions:
  outcome: ask
  tools: [task.start/atc]
  note: A coding session starts or joins only with your approval, even one you asked for.

allow-coding-spawns:
  outcome: allow
  tools: [coding.start]
  note: The start call already met your rules, so its spawn needs no second ask.

allow-coding-input:
  outcome: allow
  tools: [coding.steer, coding.message]
  destinations: ['atc:*']
  note: A bound coding session takes input without a new ask.

allow-stop-started-sessions:
  outcome: allow
  tools: [coding.stop]
  destinations: ['atc:*']
  checks:
    - { arg: origin, op: eq, value: started }
  note: Stopping a session that nixie started needs no ask.
