# The starter rules. Copy them into your own definitions repo and edit them there.
# The first seed applies every rule here at once.

allow-reads:
  outcome: allow
  effects: [read, fetch]
  note: Reading and fetching change nothing.

allow-notes:
  outcome: allow
  effects: [note]

allow-service-writes:
  outcome: allow
  effects: [write]
  note: The service can restore what a write changes.

allow-sends-within-limits:
  outcome: allow
  effects: [send]
  note: The destination limits still bound every send.

allow-sandboxed-code:
  outcome: allow
  effects: [code_run]

allow-read-commands:
  outcome: allow
  tools: [computer.run]
  effects: [computer_run]
  checks:
    - arg: command
      op: matches
      value:
        - cat *
        - df *
        - du *
        - file *
        - find *
        - grep *
        - head *
        - ls *
        - pwd *
        - stat *
        - tail *
        - wc *
        - which *
    - arg: command
      op: excludes
      value:
        - file *--co*
        - file *-*C*
        - find *-delete*
        - find *-exec*
        - find *-fls*
        - find *-fprint*
        - find *-ok*
  note: >-
    These commands only read. Each command on the line must be one of them, with no redirection or
    substitution, and find and file lose the options that run, delete or write.

allow-narrowing:
  outcome: allow
  effects: [policy_narrow, budget_lower]

ask-permanent-deletes:
  outcome: ask
  effects: [delete]

ask-exports:
  outcome: ask
  effects: [export]
  note: An export, such as a memory or event log export, leaves nixie.

ask-stranger-with-memory:
  outcome: ask
  tools: [task.start/sandbox]
  checks:
    - { arg: persona, op: eq, value: none }
    - { arg: memory, op: eq, value: read }
  note: A task without the persona reads your memory only with your approval.
